name: update bangumi data

on:
  schedule:
    - cron: '30 21 * * 2'
  workflow_dispatch:
    inputs:
      seed_history:
        description: '首次手动传入的历史 JSON（仅 cache 为空时使用，内容为时间-数量对数组）'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

env:
  REPORT_PAGES: >-
    https://bgm.tv/group/topic/469999,
    https://bgm.tv/group/topic/461956
  AUTO_MODE: "true"
  ALIAS_JSON: "person_alias.json"
  ALIAS_GZ: "person_alias.json.gz"
  DUCKDB_VERSION: "1.2.0"

jobs:
  check_and_filter:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: '**/*.py'

      - name: 设置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: bgq/go.mod
          cache-dependency-path: bgq/go.sum

      - name: 下载 DuckDB
        run: |
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip" -o /tmp/duckdb.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/duckdb.zip').extractall('bgq/bin/')"
          chmod +x bgq/bin/duckdb

      - name: 构建 bgq 与 missing-persons
        run: |
          cd bgq
          mkdir -p internal/server/dist
          touch internal/server/dist/.keep
          go build -o bin/bgq ./cmd/bgq/
          go build -o bin/missing-persons ./cmd/missing-persons/

      - name: 下载 Bangumi 归档
        run: bash bgq/download-archive.sh bangumi_archive

      - name: 构建 DuckDB 数据库
        run: bgq/bin/bgq ingest --data-dir bangumi_archive --db bgq/bangumi.db

      - name: 检查重复条目
        run: uv run find_duplicate_isbns.py

      - name: 生成别名 JSON
        run: uv run person_alias.py

      - name: 查找别名需标注本名的条目
        run: |
          mkdir -p results
          uv run find_alias_staff_needs_realname.py --archive-dir bangumi_archive --aliases-file person_alias.json --output results/alias-annotate.csv

      - name: 清除改名後殘餘的本名標註
        run: |
          mkdir -p results
          uv run find_stale_realname_annotations.py --archive-dir bangumi_archive --aliases-file person_alias.json --output results/stale-realname-annotations.csv

      - name: 清理动画职位字段中的重复人名
        run: |
          mkdir -p results
          uv run dedupe_staff_names.py --out results/duplicate-staff-names.csv

      - name: 查找可转换简体中文名的人物/角色
        run: |
          mkdir -p results
          uv run find_missing_cn_name.py bangumi_archive results --whitelist person_cn_name_whitelist.txt

      - name: 查找同名人物
        if: ${{ env.BANGUMI_TOKEN != '' }}
        env:
          BANGUMI_TOKEN: ${{ secrets.BANGUMI_TOKEN }}
        run: python3 find_dup_person_name.py | uv run sync_index.py --index 100490

      - name: gzip 压缩
        run: gzip -9 -c ${{ env.ALIAS_JSON }} > ${{ env.ALIAS_GZ }}

      - name: 执行筛选查询
        env:
          DUCKDB_PATH: ${{ github.workspace }}/bgq/bin/duckdb
        run: |
          mkdir -p results
          DATA_DIR="${GITHUB_WORKSPACE}/bangumi_archive"
          BIN="${GITHUB_WORKSPACE}/bgq/bin/bgq"

          success=0
          fail=0

          for yaml_file in filters/*.yaml; do
            if [ ! -f "$yaml_file" ]; then
              echo "⚠ 没有找到 YAML 配置文件"
              continue
            fi

            name=$(basename "$yaml_file" .yaml)
            echo ""
            echo "========================================"
            echo "  处理: $name"
            echo "========================================"

            if "${BIN}" query \
                --config "$yaml_file" \
                --data-dir "${DATA_DIR}" \
                --format csv \
                --output "results/${name}.csv" \
                2>&1; then
              lines=$(wc -l < "results/${name}.csv" 2>/dev/null || echo 0)
              echo "✅ ${name} 完成 (${lines} 行)"
              success=$((success + 1))
            else
              echo "❌ ${name} 失败"
              fail=$((fail + 1))
            fi
          done

          echo ""
          echo "  筛选完成: ${success} 成功, ${fail} 失败"

      - name: 分隔超大 CSV
        run: |
          chmod +x split_csv.sh
          for f in results/*.csv; do
            [ -f "$f" ] || continue
            ./split_csv.sh "$f" --out-dir "results/$(basename "$f" .csv)_parts" --threshold 1000000
          done

      - name: 检查单行本卷序
        env:
          DUCKDB_PATH: ${{ github.workspace }}/bgq/bin/duckdb
        run: uv run check_volume_order.py --db bgq/bangumi.db --output _site/volume_order_report.html

      - name: 生成缺失人物列表
        env:
          DUCKDB_PATH: ${{ github.workspace }}/bgq/bin/duckdb
        run: |
          bgq/bin/missing-persons --db bgq/bangumi.db --archive-dir bangumi_archive --aliases-file person_alias.json --stats-json /tmp/missing-stats.json
          cp -r docs/missing-persons _site/missing-persons

      - name: 恢复趋势历史
        uses: actions/cache@v4
        with:
          path: trend-history.json
          key: missing-trend-${{ github.run_id }}
          restore-keys: missing-trend-

      - name: 安装 xkcd 字体
        run: |
          mkdir -p ~/.local/share/fonts/xkcd
          curl -sL --fail --retry 3 -o ~/.local/share/fonts/xkcd/xkcd-script.ttf "https://github.com/ipython/xkcd-font/releases/download/v2026.2/xkcd-script-2026.2.ttf"
          fc-cache -f ~/.local/share/fonts/xkcd/

      - name: 更新缺失人物趋势图
        env:
          SEED_HISTORY: ${{ inputs.seed_history }}
        run: |
          if [ ! -f trend-history.json ] && [ -n "$SEED_HISTORY" ]; then
            echo "$SEED_HISTORY" > trend-history.json
            echo "已写入手动传入的首次历史数据"
          fi
          uv run tools/missing_trend.py --history trend-history.json --stats /tmp/missing-stats.json --out _site/missing-trend.png
          cp trend-history.json _site/missing-trend.json

      - name: 转换为 HTML
        run: uv run .github/scripts/results_to_html.py

      - name: 同步目录
        if: ${{ env.BANGUMI_TOKEN != '' }}
        env:
          BANGUMI_TOKEN: ${{ secrets.BANGUMI_TOKEN }}
          DUCKDB_PATH: ${{ github.workspace }}/bgq/bin/duckdb
        run: |
          chmod +x sync_indices.sh
          ./sync_indices.sh --data-dir bangumi_archive --bgq bgq/bin/bgq

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传 Pages 构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
