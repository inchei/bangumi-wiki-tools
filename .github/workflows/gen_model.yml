name: update common

on:
  workflow_dispatch:
    inputs:
      no_meta_tags:
        description: '跳过归档依赖输出（不下载归档，仅更新 common 部分）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: 设置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: bgq/go.mod
          cache-dependency-path: bgq/go.sum

      - name: 下载 Bangumi 归档
        if: ${{ !inputs.no_meta_tags }}
        run: bash bgq/download-archive.sh bangumi_archive

      - name: 运行 go generate
        run: |
          cd bgq
          if [ "${{ inputs.no_meta_tags }}" = "true" ]; then
            go run ./cmd/gen-model --data-dir ../bangumi_archive --no-meta-tags
          else
            go generate ./internal/model/
          fi

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bgq/internal/model/ bgq/frontend/src/schema-data.js bgq/frontend/src/infobox-fields.js userscripts/userscript-common/position-ids.js userscripts/wikiEpStaffRelate/src/positions.generated.js userscripts/wikiBatch/src/infobox-field-order.ts 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore: update generated model files"
            git push
          fi
