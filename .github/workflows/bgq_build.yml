name: build and release bgq

on:
  push:
    branches:
      - main
    paths:
      - 'bgq/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '!bgq/*.md'
      - '!bgq/**/*.md'
      - '!bgq/docs/**'
      - '!bgq/skills/**'
      - '!bgq/**/*_test.go'
      - '!bgq/internal/query/testdata/**'
      - '!bgq/cmd/gen-model/**'
      - '!bgq/cmd/missing-persons/**'
      - '!bgq/scripts/**'
      - '!bgq/*.sh'
      - '!bgq/.air.toml'
      - '!bgq/Dockerfile'
      - '!bgq/docker-compose.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["update common"]
    types:
      - completed

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive_suffix: tar.gz
          - goos: linux
            goarch: arm64
            archive_suffix: tar.gz
          - goos: darwin
            goarch: arm64
            archive_suffix: tar.gz
          - goos: darwin
            goarch: amd64
            archive_suffix: tar.gz
          - goos: windows
            goarch: amd64
            archive_suffix: zip
          - goos: windows
            goarch: arm64
            archive_suffix: zip
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 构建前端
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: |
          cd bgq/frontend
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p ../internal/server/dist
          cp -r dist/* ../internal/server/dist/

      - name: 设置 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: bgq/go.mod
          cache-dependency-path: bgq/go.sum

      - name: 构建 bgq
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          cd bgq
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          go build -ldflags="-s -w" -o "bgq${EXT}" ./cmd/bgq/

      - name: 打包
        run: |
          PKG_NAME="bgq-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "/tmp/${PKG_NAME}"

          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          cp "bgq/bgq${EXT}" "/tmp/${PKG_NAME}/"

          cp bgq/README.md "/tmp/${PKG_NAME}/"

          cd /tmp
          if [ "${{ matrix.archive_suffix }}" = "zip" ]; then
            zip -r "${GITHUB_WORKSPACE}/${PKG_NAME}.zip" "${PKG_NAME}/"
          else
            tar czf "${GITHUB_WORKSPACE}/${PKG_NAME}.tar.gz" "${PKG_NAME}/"
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: bgq-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bgq-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            bgq-${{ matrix.goos }}-${{ matrix.goarch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有产物
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: bgq-*
          merge-multiple: true

      - name: 清理旧 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
            for i in $(seq 1 30); do
              gh release view latest >/dev/null 2>&1 || { echo "旧 release 与 tag 已清理"; exit 0; }
              sleep 2
            done
            echo "::error::旧 release 清理超时，请检查 gh release delete 是否失败"
            exit 1
          fi
          echo "无旧 release，直接创建"

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: bgq Release
          body: |
            | 平台 | 文件 |
            |------|------|
            | Linux x86_64 | `bgq-linux-amd64.tar.gz` |
            | Linux ARM | `bgq-linux-arm64.tar.gz` |
            | macOS ARM | `bgq-darwin-arm64.tar.gz` |
            | macOS Intel | `bgq-darwin-amd64.tar.gz` |
            | Windows x86_64 | `bgq-windows-amd64.zip` |
            | Windows ARM | `bgq-windows-arm64.zip` |
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
