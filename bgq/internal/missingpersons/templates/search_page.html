<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="text-scale" content="scale">
<title>人物搜索</title>
<style>{{.CSS}}</style>
</head>
<body>
{{template "config_bar"}}
{{template "nav_search"}}
<h1>人物搜索</h1>
<p class="stats">在全部缺失/关联/变体同名的人物（共 {{.Total}} 人）中搜索，点击跳转到对应页面。</p>
<div class="person-search">
  <input id="person-search-input" type="search" placeholder="输入人物名搜索全部结果" autocomplete="off">
  <button id="person-search-btn" type="button">搜索</button>
  <span id="person-search-count" class="person-search-count"></span>
</div>
<div id="person-search-results" class="person-search-results"></div>
<script>{{template "esc_html"}}</script>
<script>const _searchItems = {{.SearchItems}};</script>
<script>
(() => {
  const input = document.getElementById('person-search-input');
  const btn = document.getElementById('person-search-btn');
  const results = document.getElementById('person-search-results');
  const count = document.getElementById('person-search-count');
  if (!input || !results) return;

  const q = (new URLSearchParams(window.location.search).get('q') || '').trim();
  if (q) input.value = q;

  function rowMarkup(it) {
    const href = `${it.href}#:~:text=${encodeURIComponent(it.displayName)}`;
    return `<div class="search-result"><a class="name-link" href="${href}" target="_blank">${escHtml(it.displayName)}</a></div>`;
  }

  function render(query) {
    const s = query.trim().toLowerCase();
    results.innerHTML = '';
    if (!s) {
      count.textContent = '';
      return;
    }
    const matched = [];
    for (let i = 0; i < _searchItems.length; i++) {
      if (_searchItems[i].displayName.toLowerCase().includes(s)) {
        matched.push(_searchItems[i]);
      }
    }
    count.textContent = `匹配 ${matched.length} / ${_searchItems.length} 人`;
    for (let j = 0; j < matched.length; j++) {
      results.insertAdjacentHTML('beforeend', rowMarkup(matched[j]));
    }
  }

  if (btn) btn.addEventListener('click', () => render(input.value));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      render(input.value);
    }
  });

  if (q) render(q);
})();
</script>
</body>
</html>
